<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AEG Process Base</title>

<style>

:root {
    --bg: #f5f6f7;
    --surface: #ffffff;
    --surface-2: #f0f1f3;
    --border: #e1e3e6;
    --text: #181a1d;
    --muted: #747980;
    --accent: #e30613;
    --accent-dark: #bd000b;
    --accent-light: #fff0f1;
    --shadow: 0 8px 30px rgba(0,0,0,.06);
    --radius: 14px;
}

[data-theme="dark"] {
    --bg: #111214;
    --surface: #1a1c20;
    --surface-2: #24262b;
    --border: #303238;
    --text: #f3f4f5;
    --muted: #9da1a9;
    --accent: #ff2634;
    --accent-dark: #ff4b57;
    --accent-light: rgba(227,6,19,.14);
    --shadow: 0 10px 35px rgba(0,0,0,.25);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    line-height: 1.6;
    transition:
        background .25s ease,
        color .25s ease;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* HEADER */

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
}

[data-theme="dark"] header {
    background: rgba(26,28,32,.88);
}

.header-inner {
    max-width: 1500px;
    margin: auto;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-mark {
    width: 40px;
    height: 40px;
    background: var(--accent);
    color: white;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 13px;
}

.brand-text h1 {
    margin: 0;
    font-size: 17px;
    line-height: 1.2;
}

.brand-text span {
    color: var(--muted);
    font-size: 12px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* BUTTONS */

.btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 650;
    transition: all .18s ease;
}

.btn:hover {
    background: var(--surface-2);
    transform: translateY(-1px);
}

.icon-btn {
    width: 38px;
    height: 38px;
    padding: 0;
    display: grid;
    place-items: center;
}

/* MAIN */

main {
    max-width: 1500px;
    margin: auto;
    padding: 36px 28px 70px;
}

.page-intro {
    margin-bottom: 30px;
}

.page-intro h2 {
    margin: 0 0 5px;
    font-size: clamp(26px,3vw,38px);
    line-height: 1.15;
    letter-spacing: -1px;
}

.page-intro p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
}

/* FILTERS */

.filters {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: var(--shadow);
}

.search-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
}

.input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 9px;
    padding: 11px 13px;
    outline: none;
    transition: all .18s ease;
}

.input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
}

.filter-section {
    margin-top: 18px;
}

.filter-label {
    display: block;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 750;
    text-transform: uppercase;
    letter-spacing: .7px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.tag-filter {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    transition: all .18s ease;
}

.tag-filter:hover {
    border-color: var(--accent);
}

.tag-filter.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

/* TOOLBAR */

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.result-count {
    color: var(--muted);
    font-size: 13px;
}

.sort-select {
    width: auto;
    min-width: 190px;
}

/* CARDS */

.entries-grid {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 18px;
    align-items: start;
}

.entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    animation: cardIn .35s ease both;
    transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;
}

.entry-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 35px rgba(0,0,0,.09);
}

.entry-card.expanded {
    border-color: var(--accent);
}

.entry-head {
    padding: 20px;
    cursor: pointer;
}

.entry-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.entry-id {
    color: var(--accent);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .7px;
}

.expand-icon {
    width: 27px;
    height: 27px;
    border: 1px solid var(--border);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--muted);
    transition: transform .25s ease;
}

.entry-card.expanded .expand-icon {
    transform: rotate(180deg);
    color: var(--accent);
    border-color: var(--accent);
}

.entry-title {
    margin: 0 0 10px;
    font-size: 17px;
    line-height: 1.35;
}

.entry-preview {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.entry-tags {
    margin-top: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.tag {
    border: none;
    background: var(--surface-2);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 10px;
    font-weight: 650;
    cursor: pointer;
}

.tag:hover {
    color: var(--accent);
}

.entry-details {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    border-top: 1px solid transparent;
    transition:
        max-height .35s ease,
        opacity .25s ease,
        border-color .25s ease;
}

.entry-card.expanded .entry-details {
    max-height: 2000px;
    opacity: 1;
    border-color: var(--border);
}

.entry-details-inner {
    padding: 20px;
}

.entry-content {
    font-size: 14px;
    line-height: 1.75;
}

.entry-content h3 {
    margin-top: 20px;
    margin-bottom: 8px;
}

.entry-content h3:first-child {
    margin-top: 0;
}

.entry-content ul,
.entry-content ol {
    padding-left: 22px;
}

.entry-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 15px 0;
}

.entry-content th,
.entry-content td {
    border: 1px solid var(--border);
    padding: 8px;
    text-align: left;
}

.entry-source {
    margin-top: 22px;
    padding-top: 15px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
}

.entry-source strong {
    color: var(--text);
}

.entry-actions {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

/* EMPTY */

.empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 70px 20px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
}

.empty-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

.empty-state h3 {
    margin: 0 0 5px;
}

.empty-state p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
}

/* TOAST */

.toast-container {
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    background: var(--text);
    color: var(--surface);
    padding: 11px 15px;
    border-radius: 9px;
    font-size: 13px;
    box-shadow: var(--shadow);
    animation: toastIn .25s ease;
}

/* ANIMATIONS */

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes toastIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* RESPONSIVE */

@media(max-width:1100px) {

    .entries-grid {
        grid-template-columns: repeat(2,minmax(0,1fr));
    }

}

@media(max-width:700px) {

    .header-inner {
        padding: 14px 16px;
    }

    .brand-text span {
        display: none;
    }

    .header-actions .btn:not(.icon-btn) {
        display: none;
    }

    main {
        padding: 25px 16px 50px;
    }

    .entries-grid {
        grid-template-columns: 1fr;
    }

    .search-row {
        grid-template-columns: 1fr;
    }

    .toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .sort-select {
        width: 100%;
    }

}

</style>
</head>

<body>

<header>

<div class="header-inner">

<div class="brand">

<div class="brand-mark">
AEG
</div>

<div class="brand-text">

<h1>Process Base</h1>

<span>
Customer Service Knowledge Base
</span>

</div>

</div>

<div class="header-actions">

<button
class="btn icon-btn"
onclick="toggleTheme()"
title="Zmień motyw">

◐

</button>

</div>

</div>

</header>


<main>

<section class="page-intro">

<h2>Baza procesów</h2>

<p>
Wewnętrzna baza procedur i procesów obsługi klienta.
</p>

</section>


<section class="filters">

<div class="search-row">

<input
id="searchInput"
class="input"
type="text"
placeholder="Szukaj po numerze, tytule, treści lub źródle..."
oninput="renderEntries()">

<button
class="btn"
onclick="clearFilters()">

Wyczyść filtry

</button>

</div>


<div class="filter-section">

<span class="filter-label">
Filtruj po tagach
</span>

<div
id="tagFilters"
class="tags">
</div>

</div>


<div class="filter-section">

<span class="filter-label">
Filtruj po źródle
</span>

<select
id="sourceFilter"
class="input"
onchange="renderEntries()">

<option value="">
Wszystkie źródła
</option>

</select>

</div>

</section>


<div class="toolbar">

<div
id="resultCount"
class="result-count">
</div>

<select
id="sortSelect"
class="input sort-select"
onchange="renderEntries()">

<option value="id-asc">
ID — rosnąco
</option>

<option value="id-desc">
ID — malejąco
</option>

<option value="title-asc">
Tytuł — A-Z
</option>

<option value="title-desc">
Tytuł — Z-A
</option>

</select>

</div>


<section
id="entriesGrid"
class="entries-grid">
</section>

</main>


<div
id="toastContainer"
class="toast-container">
</div>


<script>

/* =========================================================
   DODAWANIE WPISÓW
   =========================================================

   Każdy wpis powinien mieć:

   id      - dokładnie 4 cyfry
   title   - tytuł wpisu
   tags    - lista tagów
   content - treść HTML
   source  - źródło

   Skopiuj poniższy wzór i dodaj nowy obiekt
   przed ostatnim wpisem.

*/

const ENTRIES = [

    {
        id: "0001",

        title: "Przykładowy proces obsługi klienta",

        tags: [
            "obsługa klienta",
            "kontakt"
        ],

        content: `

            <h3>Cel procesu</h3>

            <p>
                To jest przykładowy wpis demonstracyjny.
                Możesz go zastąpić własną procedurą.
            </p>

            <h3>Przebieg</h3>

            <ol>
                <li>Zweryfikuj dane klienta.</li>
                <li>Ustal przedmiot zgłoszenia.</li>
                <li>Sprawdź odpowiednią procedurę.</li>
                <li>Przekaż klientowi dalsze instrukcje.</li>
            </ol>

            <h3>Uwagi</h3>

            <p>
                W tym miejscu możesz umieścić dodatkowe informacje.
            </p>

        `,

        source: "Przykładowa procedura AEG"
    },


    {
        id: "0002",

        title: "Przykładowy proces reklamacji",

        tags: [
            "reklamacje",
            "produkty"
        ],

        content: `

            <h3>Opis</h3>

            <p>
                Przykładowy proces reklamacyjny.
            </p>

            <h3>Procedura</h3>

            <ol>
                <li>Przyjmij zgłoszenie klienta.</li>
                <li>Zweryfikuj dane zamówienia.</li>
                <li>Sprawdź możliwość realizacji reklamacji.</li>
                <li>Poinformuj klienta o dalszych krokach.</li>
            </ol>

        `,

        source: "AEG Customer Service Manual"
    },


    {
        id: "0003",

        title: "Przykładowy problem techniczny",

        tags: [
            "techniczne",
            "obsługa klienta"
        ],

        content: `

            <h3>Diagnoza problemu</h3>

            <p>
                Przykładowa procedura postępowania
                w przypadku problemu technicznego.
            </p>

            <ul>
                <li>Ustal model produktu.</li>
                <li>Poproś klienta o opis problemu.</li>
                <li>Sprawdź podstawowe rozwiązania.</li>
                <li>Przejdź do kolejnego etapu procedury.</li>
            </ul>

        `,

        source: "Wewnętrzna baza wiedzy"
    },


    /*
        WZÓR NOWEGO WPISU

        {
            id: "0004",

            title: "Tytuł procesu",

            tags: [
                "obsługa klienta",
                "reklamacje"
            ],

            content: `

                <h3>Opis</h3>

                <p>
                    Treść procesu.
                </p>

                <h3>Procedura</h3>

                <ol>
                    <li>Pierwszy krok.</li>
                    <li>Drugi krok.</li>
                    <li>Trzeci krok.</li>
                </ol>

            `,

            source: "Nazwa źródła"
        }

    */

];


/* =========================================================
   USTAWIENIA
========================================================= */

const DEFAULT_TAGS = [
    "WKD",
    "ISP",
    "Operatec",
    "Fall",
    "Serviceauftrag",
    "Techniker",
    "Terminverschiebung",
    "Storno",
    "FPR",
    "Geräteaustausch",
    "Besuchsbericht",
    "Garantie",
    "Versicherung",
    "Ersatzteile",
    "Händler",
    "Rechnung"
];


let selectedTags = new Set();

let expandedEntries = new Set();


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        renderTagFilters();

        renderSourceFilter();

        renderEntries();

        applySavedTheme();

    }
);


/* =========================================================
   TAGI
========================================================= */

function getAllTags() {

    const entryTags = ENTRIES.flatMap(
        entry => entry.tags || []
    );

    return [
        ...new Set([
            ...DEFAULT_TAGS,
            ...entryTags
        ])
    ].sort(
        (a,b) =>
            a.localeCompare(b,"pl")
    );

}


function renderTagFilters() {

    const container =
        document.getElementById(
            "tagFilters"
        );

    container.innerHTML = "";


    const all =
        document.createElement(
            "button"
        );

    all.className =
        "tag-filter " +
        (
            selectedTags.size === 0
            ? "active"
            : ""
        );

    all.textContent =
        "Wszystkie";

    all.onclick =
        () => {

            selectedTags.clear();

            renderTagFilters();

            renderEntries();

        };

    container.appendChild(all);


    getAllTags().forEach(
        tag => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "tag-filter " +
                (
                    selectedTags.has(tag)
                    ? "active"
                    : ""
                );

            button.textContent =
                tag;

            button.onclick =
                () => {

                    if(
                        selectedTags.has(tag)
                    ) {

                        selectedTags.delete(tag);

                    }

                    else {

                        selectedTags.add(tag);

                    }

                    renderTagFilters();

                    renderEntries();

                };

            container.appendChild(button);

        }
    );

}


/* =========================================================
   ŹRÓDŁA
========================================================= */

function renderSourceFilter() {

    const select =
        document.getElementById(
            "sourceFilter"
        );

    const current =
        select.value;


    const sources =
        [
            ...new Set(
                ENTRIES
                    .map(
                        entry =>
                            entry.source
                    )
                    .filter(Boolean)
            )
        ]
        .sort(
            (a,b) =>
                a.localeCompare(
                    b,
                    "pl"
                )
        );


    select.innerHTML = `

        <option value="">
            Wszystkie źródła
        </option>

    `;


    sources.forEach(
        source => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                source;

            option.textContent =
                source;

            select.appendChild(
                option
            );

        }
    );


    select.value =
        current;

}


/* =========================================================
   RENDEROWANIE
========================================================= */

function renderEntries() {

    const grid =
        document.getElementById(
            "entriesGrid"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const source =
        document.getElementById(
            "sourceFilter"
        )
        .value;


    const sort =
        document.getElementById(
            "sortSelect"
        )
        .value;


    let filtered =
        ENTRIES.filter(
            entry => {

                const searchableText = [

                    entry.id,

                    entry.title,

                    entry.content
                        .replace(
                            /<[^>]*>/g,
                            " "
                        ),

                    entry.source || "",

                    ...(entry.tags || [])

                ]
                .join(" ")
                .toLowerCase();


                const matchesSearch =

                    !search ||

                    searchableText.includes(
                        search
                    );


                const matchesTags =

                    selectedTags.size === 0 ||

                    [...selectedTags].every(
                        tag =>
                            entry.tags.includes(
                                tag
                            )
                    );


                const matchesSource =

                    !source ||

                    entry.source === source;


                return (

                    matchesSearch &&

                    matchesTags &&

                    matchesSource

                );

            }
        );


    filtered.sort(
        (a,b) => {

            if(
                sort === "id-desc"
            ) {

                return Number(b.id)
                    -
                    Number(a.id);

            }


            if(
                sort === "title-asc"
            ) {

                return a.title.localeCompare(
                    b.title,
                    "pl"
                );

            }


            if(
                sort === "title-desc"
            ) {

                return b.title.localeCompare(
                    a.title,
                    "pl"
                );

            }


            return Number(a.id)
                -
                Number(b.id);

        }
    );


    document.getElementById(
        "resultCount"
    )
    .textContent =

        `Wyświetlono ${filtered.length} z ${ENTRIES.length} wpisów`;


    grid.innerHTML = "";


    if(
        filtered.length === 0
    ) {

        grid.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    🔎
                </div>

                <h3>
                    Nie znaleziono wpisów
                </h3>

                <p>
                    Zmień kryteria wyszukiwania
                    lub wyczyść filtry.
                </p>

            </div>

        `;

        return;

    }


    filtered.forEach(
        (entry,index) => {

            const card =
                createEntryCard(
                    entry
                );

            card.style.animationDelay =
                `${index * .025}s`;

            grid.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   KARTA WPISU
========================================================= */

function createEntryCard(entry) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "entry-card";


    if(
        expandedEntries.has(
            entry.id
        )
    ) {

        card.classList.add(
            "expanded"
        );

    }


    const tagsHTML =

        (entry.tags || [])
        .map(
            tag => `

                <button
                    class="tag"
                    onclick="
                        event.stopPropagation();
                        filterByTag('${escapeAttribute(tag)}')
                    ">

                    #${escapeHTML(tag)}

                </button>

            `
        )
        .join("");


    card.innerHTML = `

        <div
            class="entry-head"
            onclick="
                toggleEntry('${escapeAttribute(entry.id)}')
            ">


            <div class="entry-top">

                <span class="entry-id">

                    #${escapeHTML(entry.id)}

                </span>


                <span class="expand-icon">

                    ↓

                </span>

            </div>


            <h3 class="entry-title">

                ${escapeHTML(entry.title)}

            </h3>


            <p class="entry-preview">

                ${getPreview(entry.content)}

            </p>


            <div class="entry-tags">

                ${tagsHTML}

            </div>


        </div>


        <div class="entry-details">


            <div class="entry-details-inner">


                <div class="entry-content">

                    ${entry.content}

                </div>


                ${
                    entry.source

                    ?

                    `

                    <div class="entry-source">

                        Źródło:

                        <strong>

                            ${escapeHTML(entry.source)}

                        </strong>

                    </div>

                    `

                    :

                    ""

                }


                <div class="entry-actions">

                    <button
                        class="btn"
                        onclick="
                            event.stopPropagation();
                            copyEntryCode('${escapeAttribute(entry.id)}')
                        ">

                        Kopiuj kod wpisu

                    </button>

                </div>


            </div>

        </div>

    `;


    return card;

}


/* =========================================================
   ROZWIJANIE WPISU
========================================================= */

function toggleEntry(id) {

    if(
        expandedEntries.has(id)
    ) {

        expandedEntries.delete(id);

    }

    else {

        expandedEntries.add(id);

    }


    renderEntries();

}


/* =========================================================
   FILTROWANIE TAGIEM
========================================================= */

function filterByTag(tag) {

    selectedTags.clear();

    selectedTags.add(tag);

    renderTagFilters();

    renderEntries();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   PODGLĄD
========================================================= */

function getPreview(html) {

    const temp =
        document.createElement(
            "div"
        );

    temp.innerHTML =
        html;


    return escapeHTML(
        (
            temp.textContent ||
            ""
        )
        .trim()
    );

}


/* =========================================================
   WYCZYŚĆ FILTRY
========================================================= */

function clearFilters() {

    document.getElementById(
        "searchInput"
    )
    .value = "";


    document.getElementById(
        "sourceFilter"
    )
    .value = "";


    selectedTags.clear();


    renderTagFilters();

    renderEntries();

}


/* =========================================================
   KOPIOWANIE WPISU
========================================================= */

function copyEntryCode(id) {

    const entry =
        ENTRIES.find(
            item =>
                item.id === id
        );


    if(!entry) {
        return;
    }


    const code = `{
    id: "${entry.id}",
    title: ${JSON.stringify(entry.title)},
    tags: ${JSON.stringify(entry.tags)},
    content: ${JSON.stringify(entry.content)},
    source: ${JSON.stringify(entry.source || "")}
}`;


    if(
        navigator.clipboard
    ) {

        navigator.clipboard.writeText(
            code
        )
        .then(
            () =>
                showToast(
                    "Kod wpisu skopiowany."
                )
        );

    }

}


/* =========================================================
   MOTYW
========================================================= */

function toggleTheme() {

    const current =
        document.documentElement
            .getAttribute(
                "data-theme"
            );


    const next =

        current === "dark"

        ? "light"

        : "dark";


    document.documentElement
        .setAttribute(
            "data-theme",
            next
        );


    localStorage.setItem(
        "aeg_theme",
        next
    );

}


function applySavedTheme() {

    const theme =
        localStorage.getItem(
            "aeg_theme"
        );


    if(theme) {

        document.documentElement
            .setAttribute(
                "data-theme",
                theme
            );

    }

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const container =
        document.getElementById(
            "toastContainer"
        );


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        "toast";


    toast.textContent =
        message;


    container.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.remove();

        },
        2500
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(text);


    return div.innerHTML;

}


function escapeAttribute(text) {

    return String(text)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* =========================================================
   SKRÓTY KLAWIATUROWE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "/" &&
            document.activeElement.tagName !== "INPUT"
        ) {

            event.preventDefault();

            document.getElementById(
                "searchInput"
            ).focus();

        }


        if(
            event.key === "Escape"
        ) {

            document.getElementById(
                "searchInput"
            ).value = "";

            renderEntries();

        }

    }
);

</script>

</body>
</html>
