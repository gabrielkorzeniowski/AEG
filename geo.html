<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Autocomplete ulic DE</title>

<style>
body { font-family: Arial; }

#wrapper {
  position: relative;
  width: 400px;
}

input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
}

#suggestions {
  position: absolute;
  width: 100%;
  border: 1px solid #ccc;
  background: white;
  max-height: 200px;
  overflow-y: auto;
  z-index: 1000;
}

.item {
  padding: 8px;
  cursor: pointer;
}

.item:hover {
  background: #eee;
}
</style>
</head>

<body>

<h2>Adres (DE)</h2>

<div id="wrapper">
  <input id="streetInput" placeholder="Ulica (min. 3 litery)" autocomplete="off">
  <div id="suggestions"></div>
</div>

<input id="street" placeholder="Ulica">
<input id="house" placeholder="Nr domu">
<input id="plz" placeholder="Kod pocztowy">
<input id="city" placeholder="Miasto">

<script>
let timeout = null;

const input = document.getElementById("streetInput");
const container = document.getElementById("suggestions");

input.addEventListener("input", () => {
  clearTimeout(timeout);

  const query = input.value.trim();

  if (query.length < 3) {
    container.innerHTML = "";
    return;
  }

  timeout = setTimeout(() => fetchSuggestions(query), 300);
});

async function fetchSuggestions(query) {

  const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=10&countrycodes=de&q=${encodeURIComponent(query)}`;

  const res = await fetch(url, {
    headers: { "User-Agent": "street-autocomplete" }
  });

  const data = await res.json();

  // 🔥 filtr tylko ulic zaczynających się od query
  const filtered = data.filter(place => {
    if (!place.address || !place.address.road) return false;

    const street = place.address.road.toLowerCase();
    return street.startsWith(query.toLowerCase());
  });

  render(filtered);
}

function render(data) {
  container.innerHTML = "";

  data.forEach(place => {
    const div = document.createElement("div");
    div.className = "item";

    const street = place.address.road || "";
    const city = place.address.city || place.address.town || "";
    const plz = place.address.postcode || "";

    div.innerText = `${street}, ${plz} ${city}`;

    div.onclick = () => selectAddress(place);

    container.appendChild(div);
  });
}

function selectAddress(place) {
  const addr = place.address;

  document.getElementById("street").value = addr.road || "";
  document.getElementById("house").value = addr.house_number || "";
  document.getElementById("plz").value = addr.postcode || "";
  document.getElementById("city").value = addr.city || addr.town || "";

  input.value = addr.road || "";
  container.innerHTML = "";
}

// zamknięcie dropdown
document.addEventListener("click", (e) => {
  if (!document.getElementById("wrapper").contains(e.target)) {
    container.innerHTML = "";
  }
});
</script>

</body>
</html>
